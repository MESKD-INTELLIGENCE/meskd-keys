[package]
name = "meskd-keys"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "SSH key and host manager for Windows and Linux"
license = "MIT"
repository = "https://github.com/MESKD-INTELLIGENCE/meskd-keys"
homepage = "https://meskd.com"
authors = ["MESKD INTELLIGENCE <contact@meskd.com>"]
readme = "README.md"
keywords = ["ssh", "keys", "ssh-keygen", "security"]
categories = ["command-line-utilities", "gui"]

[[bin]]
name = "meskd-keys"
path = "src/main.rs"

[dependencies]
arboard = "3.7.0"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "wgpu", "wayland", "x11"] }
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rfd = "0.18.0"
ssh-key = { version = "0.6.7", features = ["ed25519", "rsa", "encryption", "std"] }
thiserror = "2.0.21"
zeroize = "1.9.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
egui_kittest = "0.37.0"
tempfile = "3.27.0"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true
