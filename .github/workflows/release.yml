name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
          - name: linux-x86_64
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $name = "meskd-keys-$env:TAG-windows-x86_64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/meskd-keys.exe, README.md, SECURITY.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Package for Linux
        if: runner.os == 'Linux'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="meskd-keys-$TAG-linux-x86_64"
          mkdir "$name"
          cp target/release/meskd-keys README.md SECURITY.md LICENSE packaging/meskd-keys.desktop packaging/install.sh "$name/"
          cp assets/icon-256.png "$name/meskd-keys.png"
          chmod +x "$name/meskd-keys" "$name/install.sh"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: |
            meskd-keys-*.zip
            meskd-keys-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - run: sha256sum meskd-keys-* > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes meskd-keys-* SHA256SUMS
